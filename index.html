<header><div><h1>Fitness-Tracker</h1><small id="date"></small></div><button id="settings">⚙ Einstellungen</button></header>
<section class="card" id="exerciseCard"><small id="progress"></small><h2 id="name"></h2></section>
<section class="card" id="editCard"><div class="current-row"><span id="currentDate" class="current-date"></span><div><label for="sets">Sätze</label><div id="sets" class="number-wheel" role="spinbutton" tabindex="0" aria-label="Sätze"></div></div><div><label for="reps">Wdh.</label><div id="reps" class="number-wheel" role="spinbutton" tabindex="0" aria-label="Wiederholungen"></div></div><div><label for="weight">Gewicht</label><div id="weight" class="number-wheel" role="spinbutton" tabindex="0" aria-label="Gewicht"></div></div><button id="done" class="enter-button" type="button" aria-label="Übung erledigt, nächste Übung" title="Erledigt / Nächste Übung">↵</button></div><div id="warning" class="warn hidden">Gewicht erhöhen: Nach 12 Wiederholungen beginnt die Übung wieder bei 8. Bitte ein höheres Gewicht einstellen.</div></section>
<section class="card" id="historyCard"><table class="table"><colgroup><col><col><col><col><col></colgroup><thead><tr><th>Datum</th><th>Sätze</th><th>Wdh.</th><th>Gewicht</th><th aria-hidden="true"></th></tr></thead><tbody id="history"></tbody></table></section>
<section class="card hidden" id="finish"><h2>Training fertig</h2><p>Alle Übungen erledigt.</p><button class="primary" id="restart">Neues Training starten</button></section>

</main><div id="overlay" class="overlay hidden"><div class="dialog"><div class="between"><h2>Übungen verwalten</h2><button id="close">Schließen</button></div><div id="manage"></div><div class="compact-item new-exercise-row"><input id="newName" aria-label="Neue Übung" placeholder="Neue Übung" maxlength="80"><div class="compact-actions"><button id="add" class="icon-btn" title="Übung hinzufügen" aria-label="Übung hinzufügen">＋</button></div></div><section style="margin-top:24px;padding-top:16px;border-top:1px solid #ddd"><div style="margin-bottom:18px"><label for="historyLimit">Vergangene Einträge anzeigen</label><input id="historyLimit" type="number" min="1" max="100" step="1" style="width:95px"></div><h3>Datensicherung</h3><div class="actions"><button id="export">Backup herunterladen</button><button id="import">Backup einlesen</button><input type="file" id="file" accept=".json,application/json" class="hidden"></div><small>Die Trainingsdaten bleiben nur in diesem Browser gespeichert.</small></section></div></div>
<script>
const $=id=>document.getElementById(id),KEY='fitness-simple-v2';
const defaults=[{id:'reverse',name:'Butterfly Reverse',weight:27,unit:'kg',reps:8,sets:2,active:true},{id:'butterfly',name:'Butterfly',weight:45,unit:'kg',reps:8,sets:2,active:true},{id:'klimmzug',name:'Klimmzug',weight:440,unit:'Nm',reps:8,sets:2,active:true}];
const iso=()=>{const d=new Date;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const date=x=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(x||''))return x||'';const [y,m,d]=x.split('-').map(Number);const wd=['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];return wd+' '+String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+'.'+String(y).slice(-2)};
const fmt=x=>Number(x).toLocaleString('de-DE',{maximumFractionDigits:2});
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.exercises)||!Array.isArray(data.history))data={exercises:defaults,history:[],session:null};
for(const e of data.exercises){if(/^(Rabel|Fitness) /.test(e.name||''))e.name=e.name.replace(/^(Rabel|Fitness) /,'');if(e.active==null)e.active=true}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Speichern fehlgeschlagen')}}
const active=()=>data.exercises.filter(e=>e.active!==false);
const ranges={sets:[1,9],reps:[1,30],weight:[0,1000]};
function setPicker(id,value){
 const [min,max]=ranges[id],n=Math.max(min,Math.min(max,Math.round(Number(value)||0)));
 const el=$(id);el.value=String(n);el.querySelector('.step-value').textContent=String(n);el.setAttribute('aria-valuenow',String(n));
}
function buildValue(id){
 const el=$(id);el.replaceChildren();
 const value=document.createElement('span');value.className='step-value';value.textContent='0';
 const controls=document.createElement('span');controls.className='step-arrows';
 for(const [symbol,delta,word] of [['▲',1,'erhöhen'],['▼',-1,'verringern']]){
  const btn=document.createElement('button');btn.type='button';btn.className='step-arrow';btn.textContent=symbol;btn.setAttribute('aria-label',word);
  btn.addEventListener('click',()=>setPicker(id,Number(el.value)+delta));
  controls.append(btn);
 }
 el.append(value,controls);
 el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();setPicker(id,Number(el.value)+(e.key==='ArrowUp'?1:-1))}});
}
['sets','reps','weight'].forEach(buildValue);
const next=e=>({sets:e.sets,reps:e.newExercise?8:(e.reps>=12?8:e.reps+1),weight:e.weight,needsWeight:!e.newExercise&&e.reps>=12});
function newSession(){data.session={date:iso(),index:0,finished:!active().length,plan:Object.fromEntries(active().map(e=>[e.id,next(e)]))};save()}
const initialHistory=[
['reverse','2026-10-19',3,8,27,'kg'],
['reverse','2026-10-23',2,8,35,'kg'],
['reverse','2026-10-26',2,15,15,'kg'],
['reverse','2026-10-30',2,8,27,'kg'],
['butterfly','2026-10-16',3,10,35,'kg'],
['butterfly','2026-10-19',2,12,37,'kg'],
['butterfly','2026-10-23',2,10,40,'kg'],
['butterfly','2026-10-26',2,12,40,'kg'],
['butterfly','2026-10-30',2,8,45,'kg'],
['klimmzug','2026-10-16',3,8,360,'Nm'],
['klimmzug','2026-10-19',3,8,400,'Nm'],
['klimmzug','2026-10-23',2,10,400,'Nm'],
['klimmzug','2026-10-26',2,12,400,'Nm'],
['klimmzug','2026-10-30',2,8,440,'Nm']
];
for(const [id,day,sets,reps,weight,unit] of initialHistory){
 if(!data.history.some(h=>h.id===id&&h.date===day)){
  data.history.push({date:day,id,name:({reverse:'Butterfly Reverse',butterfly:'Butterfly',klimmzug:'Klimmzug'})[id],sets,reps,weight,unit});
 }
}
// Nur bisherige Ausgangswerte ergänzen; neuere eigene Trainingswerte nicht überschreiben.
for(const [id,oldWeight,newWeight,unit] of [['butterfly',40,45,'kg'],['klimmzug',400,440,'Nm']]){
 const e=data.exercises.find(x=>x.id===id);
 const newer=data.history.some(h=>h.id===id&&h.date>'2026-10-30');
 if(e&&!newer&&Number(e.weight)===oldWeight&&e.reps===12){e.weight=newWeight;e.reps=8;e.last='2026-10-30';}
 const p=data.session?.plan?.[id];
 if(p&&!newer&&Number(p.weight)===oldWeight&&p.reps===8&&p.needsWeight){p.weight=newWeight;p.needsWeight=false;}
}
if(!Number.isInteger(data.historyLimit)||data.historyLimit<1||data.historyLimit>100)data.historyLimit=5;
if(!data.session)newSession();save();
function ex(){return active()[data.session.index]}
function plan(){const e=ex();if(!e)return null;return data.session.plan[e.id] ||= next(e)}
function draw(){const a=active(),s=data.session;if(s.index>=a.length)s.index=Math.max(0,a.length-1);if(!a.length)s.finished=true;$('date').textContent=date(s.date);$('currentDate').textContent=date(s.date);for(const id of ['exerciseCard','historyCard','editCard'])$(id).classList.toggle('hidden',s.finished);$('finish').classList.toggle('hidden',!s.finished);if(s.finished){document.body.style.background='#ffffff';return;}const e=ex(),p=plan();
const tones=['#dce9fa','#d9efdf','#fae7d2','#e9def6','#d7eef0','#f5dfe4'];
const exerciseOrder=data.exercises.findIndex(x=>x.id===e.id);
document.body.style.background='#ffffff';
const tone=tones[Math.max(0,exerciseOrder)%tones.length];
for(const cardId of ['exerciseCard','editCard','historyCard'])$(cardId).style.background=tone;$('progress').textContent='Übung '+(s.index+1)+' von '+a.length;$('name').textContent=e.name;setPicker('sets',p.sets);setPicker('reps',p.reps);setPicker('weight',p.weight);$('warning').classList.toggle('hidden',!p.needsWeight);$('weight').style.background=p.needsWeight?'#fff0bb':'';
const map=new Map();for(const h of data.history){if(h.id!==e.id)continue;const k=[h.date,h.reps,h.weight,h.unit].join('|');if(map.has(k))map.get(k).sets+=Number(h.sets||1);else map.set(k,{...h,sets:Number(h.sets||1)})}
const rows=[...map.values()].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,data.historyLimit);$('history').replaceChildren();for(const h of rows){let tr=document.createElement('tr');for(const v of [date(h.date),h.sets,h.reps,fmt(h.weight)+' '+(h.unit||e.unit),'']){let td=document.createElement('td');td.textContent=v;tr.append(td)}$('history').append(tr)}if(!rows.length){let tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='Noch keine Einträge';tr.append(td);$('history').append(tr)}}
$('done').onclick=()=>{const e=ex(),p=plan(),sets=Number($('sets').value),reps=Number($('reps').value),weight=Number($('weight').value);if(!Number.isInteger(sets)||sets<1||sets>9||!Number.isInteger(reps)||reps<1||reps>30||!$('weight').value||!Number.isFinite(weight)||weight<0)return alert('Bitte gültige Werte eintragen');if(p.needsWeight&&weight<=e.weight)return alert('Bitte zuerst das Gewicht erhöhen');Object.assign(e,{sets,reps,weight,last:data.session.date,newExercise:false});data.history.push({date:data.session.date,id:e.id,name:e.name,sets,reps,weight,unit:e.unit});if(data.session.index<active().length-1)data.session.index++;else data.session.finished=true;save();draw();window.scrollTo(0,0)};
$('restart').onclick=()=>{newSession();draw()};
function manage(){const root=$('manage');root.replaceChildren();for(const e of data.exercises){const item=document.createElement('div');item.className='compact-item'+(e.active?'':' is-inactive');const b=document.createElement('span');b.className='compact-name';b.textContent=e.name;const actions=document.createElement('div');actions.className='compact-actions';
const edit=document.createElement('button');edit.className='icon-btn';edit.textContent='✎';edit.title='Umbenennen';edit.setAttribute('aria-label',e.name+' umbenennen');edit.onclick=()=>{const v=prompt('Neuer Name',e.name);if(!v?.trim())return;e.name=v.trim().slice(0,80);save();manage();draw()};
const toggle=document.createElement('button');toggle.className='icon-btn';toggle.textContent=e.active?'◉':'◯';toggle.title=e.active?'Deaktivieren':'Aktivieren';toggle.setAttribute('aria-label',e.name+(e.active?' deaktivieren':' aktivieren'));toggle.onclick=()=>{e.active=!e.active;newSession();manage();draw()};
const del=document.createElement('button');del.className='icon-btn';del.textContent='🗑';del.title='Löschen';del.setAttribute('aria-label',e.name+' löschen');del.onclick=()=>{if(!confirm('Übung löschen? Der Trainingsverlauf bleibt erhalten.'))return;data.exercises=data.exercises.filter(x=>x.id!==e.id);newSession();manage();draw()};
actions.append(edit,toggle,del);item.append(b,actions);root.append(item)}}
$('settings').onclick=()=>{$('historyLimit').value=data.historyLimit;$('overlay').classList.remove('hidden');manage()};$('close').onclick=()=>{$('overlay').classList.add('hidden')};
const updateHistoryLimit=()=>{const n=Number($('historyLimit').value);if(!Number.isInteger(n)||n<1||n>100){alert('Bitte eine Zahl von 1 bis 100 eingeben.');$('historyLimit').value=data.historyLimit;return}data.historyLimit=n;save();draw()};
$('historyLimit').addEventListener('input',updateHistoryLimit);
$('historyLimit').addEventListener('change',updateHistoryLimit);
$('add').onclick=()=>{const name=$('newName').value.trim();if(!name)return alert('Name eingeben');data.exercises.push({id:'e'+Date.now(),name,weight:0,unit:'kg',reps:8,sets:2,active:true,newExercise:true});$('newName').value='';newSession();manage();draw()};
$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='fitness-backup-'+iso()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v.exercises)||!Array.isArray(v.history))throw Error();if(confirm('Daten durch Backup ersetzen?')){data=v;newSession();draw()}}catch{alert('Ungültiges Backup')}ev.target.value=''};

let swipeStart=null;
const swipeArea=document;
document.documentElement.style.touchAction='pan-y';
swipeArea.addEventListener('touchstart',ev=>{
 if(ev.touches.length!==1||!$('overlay').classList.contains('hidden'))return;
 if(ev.target.closest('button,input,select,textarea,a,[contenteditable="true"]'))return;
 const t=ev.touches[0];swipeStart={x:t.clientX,y:t.clientY};
},{passive:true});
swipeArea.addEventListener('touchend',ev=>{
 if(!swipeStart||!ev.changedTouches.length)return;
 if(!$('overlay').classList.contains('hidden')){swipeStart=null;return;}
 const t=ev.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;
 swipeStart=null;
 if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.5)return;
 const a=active(),s=data.session;
 if(s.finished||!a.length)return;
 const index=Math.max(0,Math.min(a.length-1,s.index+(dx<0?1:-1)));
 if(index===s.index)return;
 s.index=index;save();draw();
},{passive:true});
swipeArea.addEventListener('touchcancel',()=>{swipeStart=null});

// Bei Rückkehr zur App auf Aktualisierungen prüfen, ohne Trainingsdaten zu löschen.
let lastVersionCheck=0;
async function checkForUpdates(){
 if(document.visibilityState==='hidden'||!navigator.onLine)return;
 const now=Date.now();
 if(now-lastVersionCheck<15000)return;
 lastVersionCheck=now;
 try{
  const url=new URL('./index.html',location.href);
  url.searchParams.set('_check',String(now));
  const r=await fetch(url.href,{cache:'no-store'});
  if(!r.ok)return;
  const html=await r.text();
  const match=html.match(/<meta name="fitness-build" content="([^"]+)"/);
  const next=match?.[1];
  if(next&&next!==document.querySelector('meta[name="fitness-build"]')?.content){
   const dest=new URL(location.href);
   dest.searchParams.set('_v',next);
   location.replace(dest.href);
  }
 }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdates()});
window.addEventListener('pageshow',()=>checkForUpdates());
draw();
</script></body></html>
