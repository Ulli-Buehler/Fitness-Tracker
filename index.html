<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Mein Fitnesstracker</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;background:#0f172a;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 16px 60px}h1{font-size:1.7rem;margin:8px 0 4px}.sub,.small{color:#94a3b8}.sub{margin:0 0 24px}.panel{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:18px;margin-bottom:17px}h2{font-size:1.1rem;margin:0 0 16px}label{display:block;font-size:.85rem;color:#cbd5e1;margin-bottom:6px}input,button{font:inherit}input{width:100%;padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;margin-bottom:14px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid input{margin-bottom:0}button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer}.primary{background:#4ade80;color:#052e16;width:100%;margin-top:16px}.secondary{background:#334155;color:#fff}.actions{display:flex;flex-wrap:wrap;gap:9px}.empty{text-align:center;color:#94a3b8;padding:16px}.entry{border-top:1px solid #334155;padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.entry strong{display:block}.meta{color:#aebbcf;font-size:.86rem;margin-top:4px}.small{font-size:.8rem;line-height:1.5}.remove{color:#fecaca;background:transparent;border:1px solid #7f1d1d;padding:8px 10px}#message{min-height:20px;color:#86efac;font-size:.88rem;margin-top:8px}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>💪 Mein Fitnesstracker</h1><p class="sub">Einfach deine Trainingswerte festhalten.</p>
<section class="panel"><h2>Training eintragen</h2><form id="form">
<label for="date">Datum</label><input id="date" type="date" required>
<label for="exercise">Übung</label><input id="exercise" list="suggestions" placeholder="z. B. Beinpresse" maxlength="80" required autocomplete="off"><datalist id="suggestions"><option value="Beinpresse"><option value="Brustpresse"><option value="Latzug"><option value="Rudern"><option value="Schulterpresse"><option value="Beinbeuger"><option value="Beinstrecker"><option value="Bauchmaschine"><option value="Rückenstrecker"></datalist>
<div class="grid"><div><label for="weight">Gewicht (kg)</label><input id="weight" type="number" min="0" max="9999" step=".5" inputmode="decimal" placeholder="40" required></div><div><label for="reps">Wiederholungen</label><input id="reps" type="number" min="1" max="1000" step="1" inputmode="numeric" placeholder="12" required></div></div>
<button class="primary" type="submit">+ Satz speichern</button><div id="message" role="status" aria-live="polite"></div></form></section>
<section class="panel"><h2>Meine Einträge</h2><div id="entries"></div><div class="actions"><button id="export" type="button" class="secondary">Daten sichern (JSON)</button><button id="csv" type="button" class="secondary">CSV exportieren</button><button id="importButton" type="button" class="secondary">Sicherung einlesen</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p class="small">Deine Werte werden ausschließlich in diesem Browser gespeichert, nicht auf GitHub. Sichere sie regelmäßig. Beim Löschen der Browserdaten können die Werte verloren gehen.</p></section>
</main><script>
'use strict';
const KEY='fitness-tracker-v1', $=id=>document.getElementById(id);
function valid(r){return r&&typeof r.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&typeof r.exercise==='string'&&r.exercise.length>0&&r.exercise.length<=80&&Number.isFinite(r.weight)&&r.weight>=0&&r.weight<=9999&&Number.isInteger(r.reps)&&r.reps>=1&&r.reps<=1000}
let records=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))records=saved.filter(valid)}catch(e){alert('Gespeicherte Daten konnten nicht gelesen werden. Bitte Browserdaten nicht löschen.')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){alert('Speichern fehlgeschlagen. Speicherplatz prüfen.');return false}}
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('date').value=today();
function render(){const root=$('entries');root.replaceChildren();if(!records.length){const p=document.createElement('p');p.className='empty';p.textContent='Noch keine Einträge vorhanden.';root.append(p);return}
for(const r of [...records].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))){const row=document.createElement('div');row.className='entry';const body=document.createElement('div');const title=document.createElement('strong');title.textContent=r.exercise;const meta=document.createElement('div');meta.className='meta';meta.textContent=r.date.split('-').reverse().join('.')+' · '+r.weight.toLocaleString('de-DE')+' kg · '+r.reps+' Wdh.';body.append(title,meta);const del=document.createElement('button');del.type='button';del.className='remove';del.textContent='Löschen';del.onclick=()=>{if(confirm('Diesen Satz löschen?')){const old=records;records=records.filter(x=>x.id!==r.id);if(!save())records=old;render()}};row.append(body,del);root.append(row)}}
$('form').addEventListener('submit',e=>{e.preventDefault();const r={id:crypto.randomUUID?.()||String(Date.now())+Math.random(),date:$('date').value,exercise:$('exercise').value.trim(),weight:Number($('weight').value),reps:Number($('reps').value)};if(!valid(r)){alert('Bitte gültige Werte eingeben.');return}records.push(r);if(!save()){records.pop();return}render();$('weight').value='';$('reps').value='';$('weight').focus();$('message').textContent='Satz gespeichert!'});
function download(name,data,type){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>download('fitness-backup-'+today()+'.json',JSON.stringify(records,null,2),'application/json');
const csvValue=x=>'"'+String(x).replaceAll('"','""')+'"';$('csv').onclick=()=>{const lines=['Datum;Übung;Gewicht (kg);Wiederholungen',...records.map(r=>[r.date,r.exercise,String(r.weight).replace('.',','),r.reps].map(csvValue).join(';'))];download('fitness-'+today()+'.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8')};
$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(valid))throw Error('Ungültige Datendatei');if(!confirm('Sicherung mit '+data.length+' Einträgen importieren? Vorhandene Einträge werden ersetzt.'))return;const old=records;records=data;if(!save()){records=old;return}render();alert('Sicherung eingelesen.')}catch(err){alert('Import fehlgeschlagen: '+err.message)}finally{e.target.value=''}};
render();
</script></body></html>
